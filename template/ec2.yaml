AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Web Server desde GitHub Actions - Web Innovadora

Resources:

  # ==========================================
  # SECURITY GROUP
  # ==========================================
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir HTTP y SSH
      SecurityGroupIngress:
        # SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # HTTP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # ==========================================
  # EC2 INSTANCE
  # ==========================================
  MyEC2:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0cca150d127c2216f
      InstanceType: t3.micro
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y

          # =====================================
          # INSTALAR PAQUETES
          # =====================================
          yum install -y nginx git docker htop tree

          # =====================================
          # INICIAR NGINX
          # =====================================
          systemctl enable nginx
          systemctl start nginx

          # =====================================
          # CREAR PAGINA WEB INNOVADORA
          # =====================================
          cat > /usr/share/nginx/html/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Cloud Architecture | Next-Gen Deploy</title>
              <style>
                  :root {
                      --bg: #030712;
                      --card-bg: rgba(17, 24, 39, 0.7);
                      --primary: #00f2fe;
                      --secondary: #4facfe;
                      --text: #f3f4f6;
                      --text-muted: #9ca3af;
                  }
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      height: 100vh;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      background-color: var(--bg);
                      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      color: var(--text);
                      overflow: hidden;
                      position: relative;
                  }
                  /* Fondo Dinámico de Red Cyber */
                  .cyber-grid {
                      position: absolute;
                      width: 100%;
                      height: 100%;
                      background-image: 
                          linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
                      background-size: 40px 40px;
                      background-position: center;
                      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
                      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
                  }
                  /* Brillos de Neón de Fondo */
                  .glow-orb {
                      position: absolute;
                      width: 400px;
                      height: 400px;
                      background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, transparent 70%);
                      top: 10%;
                      left: 15%;
                      filter: blur(40px);
                      animation: float 8s ease-in-out infinite alternate;
                  }
                  .glow-orb-2 {
                      position: absolute;
                      width: 500px;
                      height: 500px;
                      background: radial-gradient(circle, rgba(79, 172, 254, 0.12) 0%, transparent 70%);
                      bottom: 5%;
                      right: 10%;
                      filter: blur(50px);
                      animation: float 12s ease-in-out infinite alternate-reverse;
                  }
                  /* Tarjeta de Cristal Estilo Neumórfico/Cyber */
                  .container {
                      position: relative;
                      z-index: 10;
                      width: 750px;
                      max-width: 90%;
                      padding: 50px;
                      border-radius: 24px;
                      background: var(--card-bg);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid rgba(255, 255, 255, 0.08);
                      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                                  0 0 40px rgba(0, 242, 254, 0.05);
                      text-align: center;
                      animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1);
                  }
                  /* Badge de Estado */
                  .status-badge {
                      display: inline-flex;
                      align-items: center;
                      gap: 8px;
                      padding: 6px 16px;
                      background: rgba(0, 242, 254, 0.1);
                      border: 1px solid rgba(0, 242, 254, 0.3);
                      color: var(--primary);
                      border-radius: 100px;
                      font-size: 13px;
                      font-weight: 600;
                      letter-spacing: 0.5px;
                      margin-bottom: 30px;
                  }
                  .pulse-dot {
                      width: 8px;
                      height: 8px;
                      background-color: var(--primary);
                      border-radius: 50%;
                      box-shadow: 0 0 10px var(--primary);
                      animation: pulse 2s infinite;
                  }
                  h1 {
                      font-size: 48px;
                      font-weight: 800;
                      background: linear-gradient(135deg, #fff 30%, #a5f3fc 100%);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      letter-spacing: -1px;
                      margin-bottom: 15px;
                  }
                  .tagline {
                      font-size: 18px;
                      color: var(--text-muted);
                      max-width: 80%;
                      margin: 0 auto 40px auto;
                      line-height: 1.6;
                  }
                  /* Grid de Tecnologías */
                  .tech-grid {
                      display: grid;
                      grid-template-columns: repeat(4, 1fr);
                      gap: 15px;
                      margin-bottom: 40px;
                  }
                  .tech-card {
                      background: rgba(255, 255, 255, 0.03);
                      border: 1px solid rgba(255, 255, 255, 0.05);
                      padding: 20px 10px;
                      border-radius: 16px;
                      transition: all 0.3s ease;
                  }
                  .tech-card:hover {
                      background: rgba(0, 242, 254, 0.05);
                      border-color: rgba(0, 242, 254, 0.2);
                      transform: translateY(-4px);
                  }
                  .tech-icon {
                      font-size: 24px;
                      margin-bottom: 8px;
                      display: block;
                  }
                  .tech-name {
                      font-size: 14px;
                      font-weight: 500;
                      color: #e5e7eb;
                  }
                  /* Footer */
                  .footer-meta {
                      border-top: 1px solid rgba(255, 255, 255, 0.05);
                      padding-top: 25px;
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      font-size: 13px;
                      color: #6b7280;
                  }
                  .live-indicator {
                      color: #10b981;
                      font-weight: 500;
                  }
                  /* Animaciones */
                  @keyframes pulse {
                      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
                      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 242, 254, 0); }
                      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
                  }
                  @keyframes float {
                      0% { transform: translateY(0px) scale(1); }
                      100% { transform: translateY(-20px) scale(1.05); }
                  }
                  @keyframes slideUp {
                      from { opacity: 0; transform: translateY(30px); }
                      to { opacity: 1; transform: translateY(0); }
                  }
                  /* Responsive */
                  @media(max-width: 768px){
                      h1 { font-size: 32px; }
                      .tech-grid { grid-template-columns: repeat(2, 1fr); }
                      .container { padding: 30px 20px; }
                      .tagline { max-width: 100%; font-size: 15px; }
                  }
              </style>
          </head>
          <body>
              <div class="cyber-grid"></div>
              <div class="glow-orb"></div>
              <div class="glow-orb-2"></div>

              <div class="container">
                  <div class="status-badge">
                      <div class="pulse-dot"></div>
                      <span>SISTEMA EN LÍNEA</span>
                  </div>

                  <h1>Infraestructura Automatizada</h1>
                  <p class="tagline">Instancia EC2 inicializada y configurada de extremo a extremo mediante arquitecturas declarativas en AWS.</p>

                  <div class="tech-grid">
                      <div class="tech-card">
                          <span class="tech-icon">☁️</span>
                          <span class="tech-name">AWS EC2</span>
                      </div>
                      <div class="tech-card">
                          <span class="tech-icon">🚀</span>
                          <span class="tech-name">GitActions</span>
                      </div>
                      <div class="tech-card">
                          <span class="tech-icon">🌐</span>
                          <span class="tech-name">NGINX</span>
                      </div>
                      <div class="tech-card">
                          <span class="tech-icon">🐳</span>
                          <span class="tech-name">Docker</span>
                      </div>
                  </div>

                  <div class="footer-meta">
                      <span>Stack: CloudFormation</span>
                      <span class="live-indicator">● CD Completo Exitoso</span>
                  </div>
              </div>
          </body>
          </html>
          EOF

          # =====================================
          # BANNER TERMINAL
          # =====================================
          cat > /etc/motd << 'EOF'

            █████╗ ██╗    ██╗███████╗
           ██╔══██╗██║    ██║██╔════╝
           ███████║██║ █╗ ██║███████╗
           ██╔══██║██║███╗██║╚════██║
           ██║  ██║╚███╔███╔╝███████║
           ╚═╝  ╚═╝ ╚══╝╚══╝ ╚══════╝

          🚀 EC2 desplegada correctamente
          🌐 NGINX activo
          🐳 Docker instalado
          🔥 GitHub Actions funcionando

          EOF

      Tags:
        - Key: Name
          Value: EC2-GitHubActions